<mat-card
  class="almanaque-card"
  [routerLink]="['/home/almanaque', tipo, id]">

  <div class="card-image-container">
    <img [src]="imagen" [alt]="nombre" class="card-image" />
  </div>

  <div class="card-content">
    <p class="card-subtype">{{ subtipo }}</p>
    <h4 class="card-name">{{ nombre }}</h4>
  </div>
</mat-card>
