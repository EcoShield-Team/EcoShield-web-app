<div class="overlay" (click)="cerrar()"></div>

<div class="modal" (click)="$event.stopPropagation()">

  <h3>Editar publicación</h3>

  <div class="input-group">
    <input type="text"
           [(ngModel)]="titulo"
           placeholder="Título"
           class="input-title"/>
  </div>

  <div class="input-group">
    <textarea [(ngModel)]="descripcion"
              placeholder="Descripción"
              rows="3"
              class="input-desc"></textarea>
  </div>

  <div class="preview-section">
    @if (previewUrl()) {
      <img [src]="previewUrl()" class="preview-img" alt="preview"/>
    }
  </div>

  <button mat-button class="img-btn" (click)="fileInput.click()">
    <mat-icon>image</mat-icon>
    Cambiar imagen
  </button>
  <input type="file" #fileInput hidden accept="image/*" (change)="onFileSelected($event)"/>

  <div class="actions">
    <button mat-button (click)="cerrar()">Cancelar</button>
    <button mat-flat-button color="primary" (click)="guardar()">Guardar cambios</button>
  </div>

</div>
