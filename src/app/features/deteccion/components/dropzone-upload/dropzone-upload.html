<div class="upload-box">
  <div class="placeholder">
    <mat-icon>cloud_upload</mat-icon>
  </div>
  <p>Arrastra y suelta o carga la imagen de tu cultivo</p>
  <p class="formats">
    Formatos compatibles: <span>JPG, PNG, GIF, HEIC, PDF</span>
  </p>

  <button mat-flat-button class="btn-upload" [routerLink]="['/home/deteccion', 'resultado']">
    <mat-icon>file_upload</mat-icon>
    Navegar
  </button>
</div>
