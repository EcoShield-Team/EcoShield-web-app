<mat-card class="status-card success-card">
  <mat-card-title>¡Feedback Enviado con Éxito!</mat-card-title>
  <mat-card-content>
    <p class="text-lg my-4">Agradecemos tu opinión. Tu feedback ha sido registrado.</p>
    <p class="detail-text">ID de confirmación: <strong>#{{ response?.feedbackId }}</strong></p>
  </mat-card-content>
  <mat-card-actions>
    <button mat-flat-button color="primary" (click)="restart.emit()" class="bg-[#15803d]">
      Enviar Nuevo Feedback
    </button>
  </mat-card-actions>
</mat-card>
