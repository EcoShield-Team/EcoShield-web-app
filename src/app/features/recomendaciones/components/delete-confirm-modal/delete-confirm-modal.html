<h2 mat-dialog-title class="dialog-title-warn">
  <mat-icon color="warn">warning</mat-icon> Confirmar Eliminación
</h2>

<div mat-dialog-content class="dialog-content">
  <p>¿Está seguro de que desea <strong>eliminar permanentemente</strong> el blog con ID <strong>#{{ data.id }}</strong>?</p>
  <p class="warning-text">Esta acción no se puede deshacer.</p>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-flat-button (click)="onNoClick()" [disabled]="isDeleting" class="cancel-button">Cancelar</button>

  <button mat-flat-button color="warn" (click)="confirmDelete()" [disabled]="isDeleting" class="delete-button">
    <mat-icon *ngIf="!isDeleting">delete</mat-icon>
    <mat-spinner *ngIf="isDeleting" diameter="20" color="warn"></mat-spinner>
    {{ isDeleting ? 'Eliminando...' : 'Eliminar' }}
  </button>
</div>
