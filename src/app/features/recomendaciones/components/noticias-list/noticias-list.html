<div class="noticias-container">

  <div *ngIf="isLoading" class="spinner-container">
    <mat-spinner [diameter]="40"></mat-spinner>
  </div>

  <div class="noticias-grid" *ngIf="!isLoading && !hasError">

    <mat-card class="noticia-card" *ngFor="let noticia of noticiasPrincipales">

      <img mat-card-image [src]="noticia.blogImagen" [alt]="noticia.blogTitulo" class="noticia-image">

      <mat-card-content class="noticia-content">
        <p class="articulo-id">ARTÍCULO {{ noticia.blogId }}</p>

        <h4 class="noticia-titulo">{{ noticia.blogTitulo }}</h4>

        <button mat-flat-button color="primary" class="leer-mas-btn">
          Leer
        </button>
      </mat-card-content>
    </mat-card>

  </div>

</div>
