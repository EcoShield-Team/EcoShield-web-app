<h2 mat-dialog-title class="dialog-title-warn">
  <mat-icon color="warn">warning</mat-icon> Confirmar Bloqueo de Usuario
</h2>

<div mat-dialog-content class="dialog-content">
  <p>¿Está seguro de que desea bloquear permanentemente al usuario</p>
  <p class="user-name-highlight">{{ data.usuarioNombre }} (ID: {{ data.usuarioId }})?</p>

  <p class="warning-text">Esta acción no se puede deshacer y el usuario perderá el acceso.</p>
</div>

<div mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button (click)="onNoClick()" [disabled]="isDeleting">Cancelar</button>

  <button mat-flat-button color="warn" (click)="confirmDelete()" [disabled]="isDeleting">
    <mat-icon *ngIf="!isDeleting">delete</mat-icon>
    <mat-spinner *ngIf="isDeleting" diameter="20" color="warn"></mat-spinner>
    {{ isDeleting ? 'Eliminando...' : 'Eliminar' }}
  </button>
</div>
