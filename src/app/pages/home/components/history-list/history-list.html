<section class="history-section">
  <h2 class="section-title">Historial reciente</h2>

  <div class="history-list">
    @for (item of historyItems(); track item.title) {
      <app-history-item [item]="item"></app-history-item>
    }
  </div>

  <div class="history-footer">
    <button mat-button class="history-view-all-button" routerLink="/home/history">
      Ver todo el historial <mat-icon>arrow_forward</mat-icon>
    </button>
  </div>
</section>
