<mat-toolbar class="navbar" color="transparent">
  <div class="navbar-left">
    <a class="navbar-brand-wrapper" routerLink="/home">
      <img ngSrc="/assets/images/logo/ecoshield-logo.svg"
           alt="EcoShield Logo"
           class="navbar-logo"
           height="40" width="40">
      <span class="navbar-brand">ECOSHIELD</span>
    </a>
  </div>

  <div class="navbar-center desktop-nav">
    <button mat-button class="nav-link" routerLink="/home"
            routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Inicio
    </button>

    <button mat-button class="nav-link" routerLink="/capturas"
            routerLinkActive="active">
      Capturas
    </button>

    <button mat-button class="nav-link" routerLink="/comunidad"
            routerLinkActive="active">
      Comunidad
    </button>

    <button mat-button class="nav-link" routerLink="/about"
            routerLinkActive="active">
      Nosotros
    </button>
  </div>

  <div class="navbar-right">

    <button mat-icon-button class="icon-button" aria-label="Notificaciones">
      <mat-icon>notifications</mat-icon>
    </button>

    <div class="user-chip" aria-label="Mi cuenta" [matMenuTriggerFor]="accountMenu">

      <img [src]="fotoPerfil()" alt="Foto de perfil" class="user-chip-avatar">

      <span class="user-name">{{ nombreUsuario() }}</span>
    </div>

    <button mat-icon-button class="mobile-menu-button" [matMenuTriggerFor]="mobileMenu" aria-label="Abrir menú">
      <mat-icon>menu</mat-icon>
    </button>

  </div>
</mat-toolbar>

<mat-menu #accountMenu="matMenu" xPosition="before" yPosition="below">
  <button mat-menu-item [routerLink]="['/comunidad/perfil']">
    <mat-icon>person</mat-icon>
    <span>Ver perfil</span>
  </button>

  <button mat-menu-item [routerLink]="['/comunidad/editar-perfil']">
    <mat-icon>manage_accounts</mat-icon>
    <span>Editar perfil</span>
  </button>

  @if (esAdministrador()) {
    <button mat-menu-item (click)="goToAdminList()">
      <mat-icon>supervisor_account</mat-icon>
      <span>Gestión de Usuarios</span>
    </button>
  }

  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Cerrar sesión</span>
  </button>
</mat-menu>

<mat-menu #mobileMenu="matMenu">
  <button mat-menu-item routerLink="/home" routerLinkActive="active-menu-item"
          [routerLinkActiveOptions]="{exact: true}">
    <mat-icon>home</mat-icon>
    <span>Inicio</span>
  </button>
  <button mat-menu-item routerLink="/capturas" routerLinkActive="active-menu-item">
    <mat-icon>camera_alt</mat-icon>
    <span>Capturas</span>
  </button>
  <button mat-menu-item routerLink="/comunidad" routerLinkActive="active-menu-item">
    <mat-icon>group</mat-icon>
    <span>Comunidad</span>
  </button>
</mat-menu>
